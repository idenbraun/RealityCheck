  <style>
    /* ----- CSS-переменные (тёмная тема по умолчанию) ----- */
    :root {
      --bg: #0a0a0a;
      --bg-gradient: radial-gradient(circle at 50% 40%, #121212 0%, #050505 100%);
      --text: #e0e0e0;
      --text-secondary: #5a5a5a;
      --text-muted: #4a4a4a;
      --text-dim: #6a6a6a;
      --panel-bg: rgba(12, 12, 12, 0.6);
      --panel-border: #262626;
      --select-bg: #141414;
      --select-border: #2c2c2c;
      --select-text: #eaeaea;
      --overlay-bg: #141414;
      --overlay-border: #2c2c2c;
      --option-text: #b0b0b0;
      --option-hover-bg: #222;
      --option-hover-text: #fff;
      --option-selected-bg: #1a1a1a;
      --btn-border: #3a3a3a;
      --btn-text: #cccccc;
      --square-empty: #181818;
      --square-empty-border: #2a2a2a;
      --square-filled: #d4d4d4;
      --square-filled-border: #6a6a6a;
      --footer-text: #3a3a3a;
      --footer-link: #6a6a6a;
      --footer-link-hover: #c0c0c0;
      --footer-border: #181818;
      --grid-title-bg: #141414;
      --grid-title-text: #909090;
      --sidebar-border: #1a1a1a;
      --toggle-track: #3a3a3a;
      --optimistic-text: #6a6a6a;
      --dot-color: #a0a0a0;
      --year-int: #f5f5f5;
      --stat-number: #9a9a9a;
      --quote-text: #5a5a5a;
      --quote-author: #444;
      --notification-bg: #1a1a1a;
      --notification-text: #c0c0c0;
      --share-btn-bg: rgba(20, 20, 20, 0.6);
      --share-btn-border: #333;
      --share-btn-text: #999;
      --share-btn-hover-bg: #2a2a2a;
      --share-btn-hover-text: #ddd;
      --share-btn-hover-border: #555;
      --modal-bg: rgba(10,10,10,0.95);
      --modal-border: #2a2a2a;
      --modal-option-hover: #1e1e1e;
      --back-btn-bg: rgba(20, 20, 20, 0.6);
      --back-btn-border: #333;
      --back-btn-text: #999;
      --back-btn-hover-bg: #2a2a2a;
      --back-btn-hover-text: #ddd;
      --back-btn-hover-border: #555;
      --qr-bg: #ffffff;
    }

    /* ----- Светлая тема ----- */
    .light-theme {
      --bg: #f5f5f5;
      --bg-gradient: radial-gradient(circle at 50% 40%, #e8e8e8 0%, #f5f5f5 100%);
      --text: #1a1a1a;
      --text-secondary: #777;
      --text-muted: #888;
      --text-dim: #555;
      --panel-bg: rgba(255, 255, 255, 0.8);
      --panel-border: #ddd;
      --select-bg: #fff;
      --select-border: #ddd;
      --select-text: #1a1a1a;
      --overlay-bg: #fff;
      --overlay-border: #ddd;
      --option-text: #555;
      --option-hover-bg: #f0f0f0;
      --option-hover-text: #1a1a1a;
      --option-selected-bg: #e8e8e8;
      --btn-border: #ccc;
      --btn-text: #555;
      --square-empty: #e0e0e0;
      --square-empty-border: #d0d0d0;
      --square-filled: #1a1a1a;
      --square-filled-border: #333;
      --footer-text: #888;
      --footer-link: #777;
      --footer-link-hover: #1a1a1a;
      --footer-border: #e0e0e0;
      --grid-title-bg: #f0f0f0;
      --grid-title-text: #555;
      --sidebar-border: #e0e0e0;
      --toggle-track: #ddd;
      --optimistic-text: #777;
      --dot-color: #777;
      --year-int: #1a1a1a;
      --stat-number: #777;
      --quote-text: #777;
      --quote-author: #999;
      --notification-bg: #f0f0f0;
      --notification-text: #444;
      --share-btn-bg: rgba(240, 240, 240, 0.7);
      --share-btn-border: #ddd;
      --share-btn-text: #777;
      --share-btn-hover-bg: #e0e0e0;
      --share-btn-hover-text: #1a1a1a;
      --share-btn-hover-border: #aaa;
      --modal-bg: rgba(250,250,250,0.95);
      --modal-border: #ddd;
      --modal-option-hover: #f0f0f0;
      --back-btn-bg: rgba(240, 240, 240, 0.7);
      --back-btn-border: #ddd;
      --back-btn-text: #777;
      --back-btn-hover-bg: #e0e0e0;
      --back-btn-hover-text: #1a1a1a;
      --back-btn-hover-border: #aaa;
    }

    /* ----- Сброс и база ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      background: var(--bg-gradient);
      background-attachment: fixed;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center center;
      transition: background 0.5s ease;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 1.5rem 1.5rem 0 1.5rem;
      font-family: 'Inter', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
      color: var(--text);
      letter-spacing: -0.01em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: transparent;
      transition: color 0.5s ease;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1 0 auto;
      width: 100%;
      max-width: 820px;
      min-height: 100vh;
      min-height: 100dvh;
      background: transparent;
    }

    .sidebar-toggle {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 48px;
      background: var(--sidebar-border);
      border: none;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      z-index: 25;
      transition: all 0.3s ease;
      opacity: 0.5;
    }

    .sidebar-toggle:hover {
      opacity: 1;
      width: 10px;
      background: var(--footer-link);
    }

    .sidebar-toggle.active {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar {
      position: fixed;
      left: -120px;
      top: 0;
      bottom: 0;
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 0.5rem;
      gap: 2rem;
      border-right: 1px solid var(--sidebar-border);
      z-index: 20;
      background: var(--bg);
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s ease, border-color 0.5s ease;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      justify-content: center;
    }

    .sidebar-dots {
      display: flex;
      gap: 5px;
      opacity: 0.3;
      margin-top: auto;
      margin-bottom: 1rem;
    }

    .sidebar-dots span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .sidebar-label {
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: -1.2rem;
      transition: color 0.3s ease;
    }

    .toggle-track {
      width: 52px;
      height: 28px;
      background: var(--toggle-track);
      border-radius: 14px;
      cursor: pointer;
      position: relative;
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
    }

    .toggle-thumb {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      left: 3px;
      top: 3px;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1;
    }

    .light-theme .toggle-thumb {
      transform: translateX(24px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .lang-toggle-track {
      width: 52px;
      height: 28px;
      background: var(--toggle-track);
      border-radius: 14px;
      cursor: pointer;
      position: relative;
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lang-toggle-thumb {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      left: 3px;
      top: 3px;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #333;
    }

    .lang-en .lang-toggle-thumb {
      transform: translateX(24px);
    }

    .lang-label-left,
    .lang-label-right {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
      z-index: 1;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }

    .lang-label-left {
      margin-right: auto;
      margin-left: 6px;
      color: #fff;
    }

    .lang-label-right {
      margin-left: auto;
      margin-right: 6px;
      color: #fff;
    }

    .lang-en .lang-label-right {
      opacity: 1;
    }
    .lang-en .lang-label-left {
      opacity: 0.3;
    }
    body:not(.lang-en) .lang-label-left {
      opacity: 1;
    }
    body:not(.lang-en) .lang-label-right {
      opacity: 0.3;
    }

    .page-content {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding-bottom: 2rem;
    }

    .container {
      width: 100%;
      max-width: 820px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2.5rem;
    }

    .date-input-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      width: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 2.5rem;
      padding: 2.5rem 2rem 3rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
      transition: all 0.5s ease;
    }

    .input-heading {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: var(--text-secondary);
      font-weight: 400;
      margin-bottom: 0.2rem;
      transition: color 0.5s ease;
    }

    .selectors {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 0.4rem;
      background: transparent;
      width: 100%;
      max-width: 500px;
    }

    .select-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      flex: 1 1 auto;
      min-width: 0;
    }

    .select-wrapper label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.5s ease;
    }

    .custom-select-container {
      position: relative;
      width: 100%;
    }

    .select-trigger {
      appearance: none;
      -webkit-appearance: none;
      background: var(--select-bg);
      border: 1px solid var(--select-border);
      border-radius: 2.5rem;
      padding: 0.9rem 2.4rem 0.9rem 1.2rem;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--select-text);
      cursor: pointer;
      text-align: center;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
      background-repeat: no-repeat;
      background-position: right 0.7rem center;
      background-size: 1.1rem;
      font-family: inherit;
      transition: border-color 0.25s, background-color 0.25s, color 0.5s ease;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .select-trigger:hover {
      border-color: #555;
      background-color: var(--option-hover-bg);
    }

    .select-overlay {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--overlay-bg);
      border: 1px solid var(--overlay-border);
      border-radius: 1rem;
      margin-top: 0.3rem;
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    .select-overlay.open {
      display: block;
    }

    .select-option {
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      color: var(--option-text);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      text-align: center;
      border-bottom: 1px solid rgba(128, 128, 128, 0.1);
    }

    .select-option:last-child {
      border-bottom: none;
    }

    .select-option:hover {
      background: var(--option-hover-bg);
      color: var(--option-hover-text);
    }

    .select-option.selected {
      background: var(--option-selected-bg);
      color: var(--option-hover-text);
    }

    .reality-btn {
      background: transparent;
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      padding: 1rem 3.5rem;
      border-radius: 3rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      margin-top: 0.8rem;
      background: rgba(20, 20, 20, 0.3);
      backdrop-filter: blur(8px);
    }

    .reality-btn:hover {
      background: #ffffff;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      letter-spacing: 0.45em;
    }

    .light-theme .reality-btn:hover {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .reality-btn:active {
      transform: scale(0.96);
    }

    .stats-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 2.5rem;
      transition: opacity 0.4s ease;
    }

    .stats-panel.active {
      display: flex;
    }

    .year-decimal-timer {
      background: transparent;
      padding: 3rem 1.5rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .big-year-number {
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 350;
      letter-spacing: -0.02em;
      color: var(--year-int);
      line-height: 1;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 30px rgba(128, 128, 128, 0.15);
      font-family: 'Inter', 'SF Mono', 'JetBrains Mono', monospace;
      word-break: break-word;
      display: flex;
      align-items: baseline;
      justify-content: center;
      transition: color 0.5s ease;
    }

    .year-integer {
      color: var(--year-int);
      transition: color 0.5s ease;
    }
    .year-dot {
      color: var(--dot-color);
      font-size: 0.7em;
      margin: 0 0.02em;
      transition: color 0.5s ease;
    }
    .year-decimal-flow {
      color: var(--dot-color);
      font-size: 0.7em;
      letter-spacing: 0.04em;
      display: inline-block;
      transition: color 0.5s ease;
    }

    .year-subtitle {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.4em;
      color: var(--text-secondary);
      margin-top: 0.2rem;
      margin-bottom: 0.8rem;
      transition: color 0.5s ease;
    }

    .secondary-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      width: 100%;
      opacity: 0.7;
      padding: 0.5rem 1rem;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 75px;
    }

    .stat-number {
      font-size: 1.7rem;
      font-weight: 350;
      letter-spacing: -0.02em;
      color: var(--stat-number);
      line-height: 1.1;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      font-family: 'Inter', 'SF Mono', 'JetBrains Mono', monospace;
      min-width: 4ch;
      display: inline-block;
      text-align: center;
      transition: color 0.5s ease;
    }

    .stat-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: var(--text-muted);
      margin-top: 0.3rem;
      transition: color 0.5s ease;
    }

    .grid-section {
      width: 100%;
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .grid-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      transition: color 0.5s ease;
    }

    .grid-title span {
      background: var(--grid-title-bg);
      padding: 0.2rem 1rem;
      border-radius: 2rem;
      font-weight: 500;
      color: var(--grid-title-text);
      border: 1px solid var(--panel-border);
      transition: all 0.5s ease;
    }

    .life-grid {
      display: grid;
      grid-template-columns: repeat(25, 1fr);
      gap: 6px;
      background: transparent;
      max-width: 800px;
      margin: 0 auto;
      justify-content: center;
      width: 100%;

      min-width: 14px;

      cursor: default;
      justify-self: center;
    }

      background: var(--square-filled);
      border-color: var(--square-filled-border);
      box-shadow: 0 0 8px rgba(128, 128, 128, 0.15);

      border-color: #888;
      box-shadow: 0 0 12px rgba(128, 128, 128, 0.3);
      transform: scale(1.15);
      z-index: 2;
      position: relative;

      height: 6rem;

      align-items: center;
      justify-content: center;
      margin-top: 1.2rem;
      overflow: hidden;

      align-items: center;
      justify-content: center;
      height: 100%;

    .bottom-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.8rem;

    .back-btn-bottom {

      align-items: center;

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--notification-bg);
      color: var(--notification-text);
      padding: 0.7rem 1.5rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;

      backdrop-filter: blur(12px);

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================================
       ФУТЕР — УНИФИЦИРОВАН С BREATH
       ============================================================ */
    .footer {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;

    }

    .footer .links {

      justify-content: center;
      white-space: nowrap;

    /* ССЫЛКИ — ТОЧНО КАК В BREATH */

    }

    .footer .year {

    @media (max-width: 500px) {
      body {

      }
      .back-btn-bottom,
      .share-btn-bottom {
        padding: 0.6rem 1.5rem;
      }
      .modal {
        padding: 1.4rem;
        min-width: 240px;
      }
      .footer .links {
        gap: 1.2rem;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

    (function() {
      const TOTAL_SQUARES = 100;
      const UPPER_LIFESPAN = 80;
      const STORAGE_KEY = 'reality-check-birthdate';
      const DECIMAL_PLACES = 9;

      const translations = {
        ru: {
          yearSubtitle: function(y) {
            if (y % 10 === 1 && y % 100 !== 11) return 'прожитый год';
            if (y % 10 >= 2 && y % 10 <= 4 && (y % 100 < 10 || y % 100 >= 20)) return 'прожитых года';
            return 'прожитых лет';
          },
          days: 'дней',
          weeks: 'недель',
          months: 'месяцев',
          gridSummary: function(y) { return 'прожито ' + y + ' из ' + TOTAL_SQUARES + ' лет'; },
          optimistic: function(r) {
            if (r % 10 === 1 && r % 100 !== 11) return 'в лучшем случае остался ~' + r + ' год';
            if (r % 10 >= 2 && r % 10 <= 4 && (r % 100 < 10 || r % 100 >= 20)) return 'в лучшем случае осталось ~' + r +
              ' года';
            return 'в лучшем случае осталось ~' + r + ' лет';
          },
          inputHeading: 'Укажите свою дату рождения',
          day: 'День',
          month: 'Месяц',
          year: 'Год',
          realityBtn: 'Reality check',
          shareBtn: '↗ Поделиться',
          backBtn: '← Назад',
          copyLink: '📋 Копировать ссылку',
          downloadPng: '💾 Скачать PNG',
          share: '📤 Поделиться',

          toastCopied: '✓ Ссылка скопирована',

          toastNeedCheck: 'Сначала выполните Reality check',

        en: {
          yearSubtitle: function(y) { return y === 1 ? 'year lived' : 'years lived'; },
          days: 'days',
          weeks: 'weeks',
          months: 'months',
          gridSummary: function(y) { return 'lived ' + y + ' of ' + TOTAL_SQUARES + ' years'; },
          optimistic: function(r) { return r === 1 ? 'at best ~' + r + ' year left' : 'at best ~' + r + ' years left'; },
          inputHeading: 'Enter your date of birth',
          day: 'Day',
          month: 'Month',
          year: 'Year',
          realityBtn: 'Reality check',
          shareBtn: '↗ Share',
          backBtn: '← Back',
          copyLink: '📋 Copy link',
          downloadPng: '💾 Download PNG',
          share: '📤 Share',
          cancel: 'cancel',
          toastCopied: '✓ Link copied',
          toastDownloaded: '✓ Screenshot downloaded',
          toastNeedCheck: 'Do Reality check first',
          futureError: 'Date of birth cannot be in the future.'
        }
      };

      const quotes = {
        ru: [
          { text: '«Ты живёшь так, будто будешь жить вечно.<br>Ты не думаешь о своей хрупкости.<br>Ты не замечаешь, сколько времени уже прошло.»',
            author: '— Сенека' },
          { text: '«Человек — это не что иное, как сумма его поступков.»', author: '— Жан-Поль Сартр' },
          { text: '«Ты уже умираешь. Прямо сейчас.»', author: '— Тайлер Дёрден, «Бойцовский клуб»' },
          { text: '«Каждый день — это маленькая жизнь.»', author: '— Марк Аврелий' },
          { text: '«А ведь где-то уже растёт дерево,<br>из которого сколотят твой гроб.»', author: '— Неизвестный автор' }
        ],
        en: [
          { text: '«You live as if you will live forever.<br>You do not think about your fragility.<br>You do not notice how much time has passed.»',
            author: '— Seneca' },
          { text: '«Man is nothing else but the sum of his actions.»', author: '— Jean-Paul Sartre' },
          { text: '«You are already dying. Right now.»', author: '— Tyler Durden, «Fight Club»' },
          { text: '«Each day is a little life.»', author: '— Marcus Aurelius' },
          { text: '«Somewhere a tree is already growing<br>from which your coffin will be made.»',
            author: '— Unknown author' }
        ]
      };

      let currentLang = 'ru';
      let currentQuoteIndex = 0;
      let quoteIntervalId = null;
      let qrCodeInstance = null;

      function t(key) { var val = translations[currentLang][key]; return typeof val === 'function' ? val : val; }

      function getCurrentQuotes() { return quotes[currentLang]; }

      function updateAllTexts() {
        document.querySelectorAll('[data-ru][data-en]').forEach(function(el) { el.textContent = el.getAttribute('data-' +
            currentLang); });
        if (birthDate) { var details = computeLivedDetails(birthDate); updateYearSubtitle(details.years);
          updateGridTexts(details.years); updateStatLabels(); }
      }

      function updateYearSubtitle(years) { document.getElementById('yearSubtitle').textContent = translations[currentLang]
          .yearSubtitle(years); }

      function updateGridTexts(years) {
        var c = Math.min(years, TOTAL_SQUARES);
        document.getElementById('gridSummary').textContent = translations[currentLang].gridSummary(c);
        document.getElementById('optimisticRemaining').textContent = translations[currentLang].optimistic(Math.max(0,
          UPPER_LIFESPAN - c));
      }

      function updateStatLabels() { document.querySelectorAll('.stat-label[data-ru][data-en]').forEach(function(el) { el
            .textContent = el.getAttribute('data-' + currentLang); }); }

      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebarToggle');
      const themeToggle = document.getElementById('themeToggle');
      const toggleIcon = document.getElementById('toggleIcon');
      const langToggle = document.getElementById('langToggle');
      const shareBtnBottom = document.getElementById('shareBtnBottom');
      const backBtnBottom = document.getElementById('backBtnBottom');
      const shareModal = document.getElementById('shareModal');
      const modalQrContainer = document.getElementById('modalQrContainer');
      const toast = document.getElementById('toast');
      const dayTrigger = document.getElementById('dayTrigger');
      const monthTrigger = document.getElementById('monthTrigger');
      const yearTrigger = document.getElementById('yearTrigger');
      const dayOverlay = document.getElementById('dayOverlay');
      const monthOverlay = document.getElementById('monthOverlay');
      const yearOverlay = document.getElementById('yearOverlay');
      const realityBtn = document.getElementById('realityButton');
      const dateInputPanel = document.getElementById('dateInputPanel');
      const statsPanel = document.getElementById('statsPanel');
      const yearIntegerEl = document.getElementById('yearInteger');
      const yearDecimalFlowEl = document.getElementById('yearDecimalFlow');
      const daysLivedEl = document.getElementById('daysLived');
      const weeksLivedEl = document.getElementById('weeksLived');
      const monthsLivedEl = document.getElementById('monthsLived');
      const lifeGridEl = document.getElementById('lifeGrid');
      const gridSummaryEl = document.getElementById('gridSummary');
      const optimisticRemainingEl = document.getElementById('optimisticRemaining');
      const quoteTextEl = document.getElementById('quoteText');
      const quoteAuthorEl = document.getElementById('quoteAuthor');

      let birthDate = null;
      let animationFrameId = null;
      let currentGridYear = -1;
      let frameCount = 0;
      let selectedDay = 1,
        selectedMonth = 1,
        selectedYear = 1995;

      const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь',
        'Ноябрь', 'Декабрь'
      ];

      let toastTimer = null;

      function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); if (toastTimer) clearTimeout(
          toastTimer); toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2000); }

      function saveBirthDate(d) {
        if (d) {
          localStorage.setItem(STORAGE_KEY, d.toISOString());
        } else {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      function loadBirthDate() {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          var parsed = new Date(saved);
          if (!isNaN(parsed.getTime()) && parsed <= new Date()) {
            return parsed;
          }
        }
        return null;
      }

        selectedDay = d.getDate();
        selectedMonth = d.getMonth() + 1;
        selectedYear = d.getFullYear();
        dayTrigger.textContent = selectedDay;
        monthTrigger.textContent = monthNames[selectedMonth - 1];
        yearTrigger.textContent = selectedYear;
        renderDayOptions();
        renderMonthOptions();
        renderYearOptions();
      }

        modalQrContainer.innerHTML = '';
        qrCodeInstance = new QRCode(modalQrContainer, {
          text: window.location.href,
          width: 120,
          height: 120,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });

      sidebarToggle.addEventListener('click', function() { sidebar.classList.toggle('open'); sidebarToggle.classList.toggle(
          'active'); });
      document.addEventListener('click', function(e) { if (!sidebar.contains(e.target) && e.target !== sidebarToggle) { sidebar
            .classList.remove('open');
          sidebarToggle.classList.remove('active'); } });

      // ----- ТЕМА: ФИКС ОБНОВЛЕНИЯ ФОНА -----
      function applyTheme(theme) {
        var isLight = theme === 'light';
        document.body.classList.toggle('light-theme', isLight);
        toggleIcon.textContent = isLight ? '☀️' : '🌙';

        // Принудительно задаем фон на html в зависимости от темы
        if (isLight) {
          document.documentElement.style.background = 'radial-gradient(circle at 50% 40%, #e8e8e8 0%, #f5f5f5 100%)';
        } else {
          document.documentElement.style.background = 'radial-gradient(circle at 50% 40%, #121212 0%, #050505 100%)';
        }

        localStorage.setItem('reality-check-theme', theme);
      }

      var savedTheme = localStorage.getItem('reality-check-theme') || 'dark';
      applyTheme(savedTheme);

      themeToggle.addEventListener('click', function() {
        var isLight = document.body.classList.contains('light-theme');
        applyTheme(isLight ? 'dark' : 'light');
      });

      // ----- ЯЗЫК -----
      var savedLang = localStorage.getItem('reality-check-lang') || 'ru';
      currentLang = savedLang;
      if (currentLang === 'en') document.body.classList.add('lang-en');
      updateAllTexts();
      langToggle.addEventListener('click', function() {
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        if (currentLang === 'en') document.body.classList.add('lang-en');
        else document.body.classList.remove('lang-en');
        localStorage.setItem('reality-check-lang', currentLang);
        updateAllTexts();
        if (birthDate) { var details = computeLivedDetails(birthDate); updateYearSubtitle(details.years);
          updateGridTexts(details.years); updateStatLabels(); }
        showQuoteRaw(getCurrentQuotes()[currentQuoteIndex % getCurrentQuotes().length]);
      });

      shareBtnBottom.addEventListener('click', function() {
        if (!birthDate) { showToast(t('toastNeedCheck')); return; }
        generateModalQR();
        shareModal.classList.add('open');
      });

      backBtnBottom.addEventListener('click', function() {
        stopRealtimeUpdates();
        stopQuoteCarousel();
        statsPanel.classList.remove('active');
        dateInputPanel.style.display = 'flex';
        if (birthDate) {
          restoreSelectsFromDate(birthDate);
        }
      });

      shareModal.addEventListener('click', async function(e) {
        var action = e.target.dataset.action;
        if (!action) return;
        shareModal.classList.remove('open');
        if (action === 'close') return;
        if (action === 'copy') { try { await navigator.clipboard.writeText(window.location.href);
            showToast(t('toastCopied')); } catch (err) { showToast(window.location.href); } } else if (action ===
          'download') { await generateScreenshot(); } else if (action === 'share') {
          try {
            var blob = await generateScreenshotBlob();
            if (!blob) return;
            var file = new File([blob], 'reality-check.png', { type: 'image/png' });
            if (navigator.share) await navigator.share({ title: 'Reality Check', files: [file] });
            else { var url = URL.createObjectURL(blob); var a = document.createElement('a');
              a.href = url;
              a.download = 'reality-check.png';
              a.click();
              URL.revokeObjectURL(url); }
          } catch (err) {}
        }
      });

      async function generateScreenshotBlob() {
        var details = computeLivedDetails(birthDate);
        var decimalYears = computeExactDecimalYears(birthDate);
        var quote = getCurrentQuotes()[currentQuoteIndex % getCurrentQuotes().length];
        var isLight = document.body.classList.contains('light-theme');
        var bg = isLight ? '#f5f5f5' : '#0a0a0a',
          text = isLight ? '#1a1a1a' : '#f5f5f5',
          muted = isLight ? '#777' : '#888';
        var sEmpty = isLight ? '#e0e0e0' : '#181818',
          sFilled = isLight ? '#1a1a1a' : '#d4d4d4';
        var wrapper = document.createElement('div');
        wrapper.style.cssText =
          'position:fixed;left:-9999px;top:0;width:1080px;background:' + bg + ';padding:200px 120px 180px;font-family:Inter,sans-serif;display:flex;flex-direction:column;align-items:center;color:' +
          text + ';';
        wrapper.innerHTML = '<div style="font-size:2.2rem;font-weight:350;font-family:monospace;text-align:center;">' +
          Math.floor(decimalYears) + '<span style="font-size:0.7em;color:' + muted + ';">.' + decimalYears.toFixed(
            DECIMAL_PLACES).split('.')[1] + '</span></div>' +
          '<div style="font-size:0.55rem;text-transform:uppercase;letter-spacing:0.4em;color:' + muted +
          ';margin-bottom:2rem;">' + translations[currentLang].yearSubtitle(details.years) + '</div>' +
          '<div style="display:flex;gap:2rem;margin-bottom:2rem;color:' + muted + ';font-size:0.7rem;"><div>' + details
          .days.toLocaleString() + ' <span style="font-size:0.5rem;opacity:0.6;">' + t('days') + '</span></div><div>' +
          details.weeks.toLocaleString() + ' <span style="font-size:0.5rem;opacity:0.6;">' + t('weeks') +
          '</span></div><div>' + details.months.toLocaleString() + ' <span style="font-size:0.5rem;opacity:0.6;">' + t(
            'months') + '</span></div></div>' +
          '<div style="font-size:0.55rem;text-transform:uppercase;letter-spacing:0.3em;color:' + muted +
          ';margin-bottom:0.3rem;">' + translations[currentLang].gridSummary(details.years) + '</div>' +
          '<div style="display:grid;grid-template-columns:repeat(25,14px);gap:5px;margin-bottom:1rem;">' + Array.from({
            length: 100
          }, function(_, i) { return '<div style="width:14px;height:14px;background:' + (i < details.years ?
              sFilled : sEmpty) + ';border:1px solid ' + (i < details.years ? '#6a6a6a' : '#2a2a2a') +
            ';"></div>'; }).join('') + '</div>' +
          '<div style="font-size:0.5rem;color:' + muted + ';opacity:0.6;margin-bottom:1.5rem;">' + translations[
            currentLang].optimistic(Math.max(0, 80 - details.years)) + '</div>' +
          '<div style="font-size:0.6rem;font-style:italic;color:' + muted +
          ';text-align:center;max-width:380px;line-height:1.4;margin-bottom:0.2rem;">' + quote.text.replace(/<br>/g,
            ' ') + '</div>' +
          '<div style="font-size:0.5rem;color:' + muted + ';opacity:0.7;">' + quote.author + '</div>' +
          '<div style="font-size:0.4rem;color:' + muted + ';opacity:0.4;margin-top:2rem;">reality-check</div>';
        document.body.appendChild(wrapper);
        try { var canvas = await html2canvas(wrapper, { backgroundColor: bg, scale: 2 }); return await new Promise(
            function(r) { canvas.toBlob(r, 'image/png'); }); } finally { document.body.removeChild(wrapper); }
      }

      async function generateScreenshot() { var blob = await generateScreenshotBlob(); if (!blob) return; var url =
          URL.createObjectURL(blob); var a = document.createElement('a');
        a.href = url;
        a.download = 'reality-check.png';
        a.click();
        URL.revokeObjectURL(url);
        showToast(t('toastDownloaded')); }

      function getDaysInMonth(m, y) { return new Date(y, m, 0).getDate(); }

      function renderDayOptions() {
        dayOverlay.innerHTML = '';
        var dim = getDaysInMonth(selectedMonth, selectedYear);
        if (selectedDay > dim) selectedDay = dim;
        for (var d = 1; d <= dim; d++) { var o = document.createElement('div');
          o.className = 'select-option' + (d === selectedDay ? ' selected' : '');
          o.textContent = d;
          o.addEventListener('click', function(e) { e.stopPropagation();
            selectedDay = parseInt(this.textContent, 10);
            dayTrigger.textContent = this.textContent;
            closeOverlay(dayOverlay); });
          dayOverlay.appendChild(o); }
        dayTrigger.textContent = selectedDay;
      }

      function renderMonthOptions() {
        monthOverlay.innerHTML = '';
        monthNames.forEach(function(n, i) { var mn = i + 1; var o = document.createElement('div');
          o.className = 'select-option' + (mn === selectedMonth ? ' selected' : '');
          o.textContent = n;
          o.addEventListener('click', function(e) { e.stopPropagation();
            selectedMonth = mn;
            monthTrigger.textContent = n;
            closeOverlay(monthOverlay);
            renderDayOptions(); });
          monthOverlay.appendChild(o); });
        monthTrigger.textContent = monthNames[selectedMonth - 1];
      }

      function renderYearOptions() {
        yearOverlay.innerHTML = '';
        var cy = new Date().getFullYear();
        for (var y = cy - 1; y >= cy - 100; y--) { var o = document.createElement('div');
          o.className = 'select-option' + (y === selectedYear ? ' selected' : '');
          o.textContent = y;
          o.addEventListener('click', function(e) { e.stopPropagation();
            selectedYear = parseInt(this.textContent, 10);
            yearTrigger.textContent = this.textContent;
            closeOverlay(yearOverlay);
            renderDayOptions(); });
          yearOverlay.appendChild(o); }
        yearTrigger.textContent = selectedYear;
      }

      function openOverlay(o) { if (currentOpenOverlay && currentOpenOverlay !== o) closeOverlay(currentOpenOverlay);
        o.classList.add('open');
        currentOpenOverlay = o; }

      function closeOverlay(o) { o.classList.remove('open'); if (currentOpenOverlay === o) currentOpenOverlay = null; }

      dayTrigger.addEventListener('click', function(e) { e.stopPropagation();
        dayOverlay.classList.contains('open') ? closeOverlay(dayOverlay) : (renderDayOptions(), openOverlay(
        dayOverlay)); });
      monthTrigger.addEventListener('click', function(e) { e.stopPropagation();
        monthOverlay.classList.contains('open') ? closeOverlay(monthOverlay) : (renderMonthOptions(), openOverlay(
          monthOverlay)); });
      yearTrigger.addEventListener('click', function(e) { e.stopPropagation();
        yearOverlay.classList.contains('open') ? closeOverlay(yearOverlay) : (renderYearOptions(), openOverlay(
          yearOverlay)); });
      document.addEventListener('click', function() { [dayOverlay, monthOverlay, yearOverlay].forEach(function(o) {
          closeOverlay(o); }); });

      function showQuoteRaw(quote) { quoteTextEl.style.opacity = '0';
        quoteAuthorEl.style.opacity = '0';
        setTimeout(function() { quoteTextEl.innerHTML = quote.text;
          quoteAuthorEl.textContent = quote.author;
          quoteTextEl.style.opacity = '0.7';
          quoteAuthorEl.style.opacity = '1'; }, 400); }

      function showQuote(index) { showQuoteRaw(getCurrentQuotes()[index % getCurrentQuotes().length]); }

      function startQuoteCarousel() { if (quoteIntervalId) clearInterval(quoteIntervalId);
        currentQuoteIndex = 0;
        showQuote(0);
        quoteIntervalId = setInterval(function() { currentQuoteIndex = (currentQuoteIndex + 1) % getCurrentQuotes()
            .length;
          showQuote(currentQuoteIndex); }, 6000); }

      function stopQuoteCarousel() { if (quoteIntervalId) { clearInterval(quoteIntervalId);
          quoteIntervalId = null; } }

      function getBirthDateFromSelects() { return new Date(selectedYear, selectedMonth - 1, selectedDay); }

      function computeExactDecimalYears(b) { return (new Date() - b) / (365.25 * 24 * 60 * 60 * 1000); }

      function computeLivedDetails(b) {
        var n = new Date(),
          d = n - b;
        if (d < 0) return { days: 0, weeks: 0, months: 0, years: 0 };
        var td = Math.floor(d / (1000 * 60 * 60 * 24)),
          tw = Math.floor(td / 7);
        var y = n.getFullYear() - b.getFullYear(),
          m = n.getMonth() - b.getMonth(),
          dd = n.getDate() - b.getDate();
        if (dd < 0) { m--;
          dd += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
        if (m < 0) { y--;
          m += 12; }
        return { days: td, weeks: tw, months: y * 12 + m, years: y };
      }

      function renderGrid(lived) {
        var c = Math.min(lived, TOTAL_SQUARES);
        if (c === currentGridYear) return;
        currentGridYear = c;
        lifeGridEl.innerHTML = '';
        for (var i = 0; i < TOTAL_SQUARES; i++) { var s = document.createElement('div');
          s.className = 'square' + (i < c ? ' filled' : '');
          lifeGridEl.appendChild(s); }
        gridSummaryEl.textContent = translations[currentLang].gridSummary(c);
        optimisticRemainingEl.textContent = translations[currentLang].optimistic(Math.max(0, UPPER_LIFESPAN - c));
      }

      function updateLiveCounter() {
        if (!birthDate) return;
        frameCount++;
        var dy = computeExactDecimalYears(birthDate),
          parts = dy.toFixed(DECIMAL_PLACES).split('.');
        yearIntegerEl.textContent = parts[0];
        yearDecimalFlowEl.textContent = parts[1];
        var det = computeLivedDetails(birthDate);
        daysLivedEl.textContent = det.days.toLocaleString();
        weeksLivedEl.textContent = det.weeks.toLocaleString();
        monthsLivedEl.textContent = det.months.toLocaleString();
        renderGrid(det.years);
        updateYearSubtitle(det.years);
      }

      function startRealtimeUpdates() { if (animationFrameId) cancelAnimationFrame(animationFrameId);

        function tick() { updateLiveCounter();
          animationFrameId = requestAnimationFrame(tick); }
        tick(); }

      function stopRealtimeUpdates() { if (animationFrameId) { cancelAnimationFrame(animationFrameId);
          animationFrameId = null; } }

      function showStatsPanel() {
        dateInputPanel.style.display = 'none';
        statsPanel.classList.add('active');
        currentGridYear = -1;
        if (birthDate) {
          updateLiveCounter();
          startRealtimeUpdates();
        }
        startQuoteCarousel();
      }

      function showInputPanel() {
        stopRealtimeUpdates();
        stopQuoteCarousel();
        statsPanel.classList.remove('active');
        dateInputPanel.style.display = 'flex';
      }

      realityBtn.addEventListener('click', function() {
        var nd = getBirthDateFromSelects();
        if (nd > new Date()) { alert(t('futureError')); return; }
        stopRealtimeUpdates();
        birthDate = nd;
        saveBirthDate(birthDate);
        showStatsPanel();
      });

      window.addEventListener('beforeunload', function() { stopRealtimeUpdates();
        stopQuoteCarousel(); });

      renderDayOptions();
      renderMonthOptions();
      renderYearOptions();

      var savedDate = loadBirthDate();
      if (savedDate) {
        birthDate = savedDate;
        restoreSelectsFromDate(birthDate);
        showStatsPanel();
      } else {
        showInputPanel();
      }
    })();
  </script>
</body>
</html>
