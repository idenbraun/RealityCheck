    <style>
        /* ============================================================
           ПЕРЕМЕННЫЕ — ТЁМНАЯ ТЕМА
           ============================================================ */
        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --text-secondary: #7a7a7a;
            --text-muted: #5a5a5a;
            --panel-bg: rgba(12, 12, 12, 0.6);
            --panel-border: #262626;
            --select-bg: #141414;
            --select-border: #2c2c2c;
            --select-text: #eaeaea;
            --overlay-bg: #141414;
            --overlay-border: #2c2c2c;
            --option-text: #b0b0b0;
            --option-hover-bg: #222;
            --option-hover-text: #fff;
            --option-selected-bg: #1a1a1a;
            --btn-border: #3a3a3a;
            --btn-text: #cccccc;
            --square-empty: #181818;
            --square-empty-border: #2a2a2a;
            --square-filled: #d4d4d4;
            --square-filled-border: #6a6a6a;
            --footer-text: #4a4a4a;
            --footer-link: #7a7a7a;
            --footer-link-hover: #c0c0c0;
            --footer-border: #181818;
            --grid-title-bg: #141414;
            --grid-title-text: #a0a0a0;
            --sidebar-border: #1a1a1a;
            --toggle-track: #3a3a3a;
            --optimistic-text: #7a7a7a;
            --dot-color: #b0b0b0;
            --year-int: #f5f5f5;
            --stat-number: #aaaaaa;
            --quote-text: #6a6a6a;
            --quote-author: #555;
            --notification-bg: #1a1a1a;
            --notification-text: #c0c0c0;
            --share-btn-bg: rgba(20, 20, 20, 0.6);
            --share-btn-border: #333;
            --share-btn-text: #aaa;
            --share-btn-hover-bg: #2a2a2a;
            --share-btn-hover-text: #ddd;
            --share-btn-hover-border: #555;
            --modal-bg: rgba(10,10,10,0.95);
            --modal-border: #2a2a2a;
            --modal-option-hover: #1e1e1e;
            --back-btn-bg: rgba(20, 20, 20, 0.6);
            --back-btn-border: #333;
            --back-btn-text: #aaa;
            --back-btn-hover-bg: #2a2a2a;
            --back-btn-hover-text: #ddd;
            --back-btn-hover-border: #555;
            --qr-bg: #ffffff;
            --memento-logo-text: #a0a0a0;
        }

        /* ============================================================
           ПЕРЕМЕННЫЕ — СВЕТЛАЯ ТЕМА
           ============================================================ */
        .light-theme {
            --bg: #f5f5f5;
            --text: #1a1a1a;
            --text-secondary: #666;
            --text-muted: #777;
            --panel-bg: rgba(255, 255, 255, 0.8);
            --panel-border: #ddd;
            --select-bg: #fff;
            --select-border: #ddd;
            --select-text: #1a1a1a;
            --overlay-bg: #fff;
            --overlay-border: #ddd;
            --option-text: #555;
            --option-hover-bg: #f0f0f0;
            --option-hover-text: #1a1a1a;
            --option-selected-bg: #e8e8e8;
            --btn-border: #ccc;
            --btn-text: #666;
            --square-empty: #e0e0e0;
            --square-empty-border: #d0d0d0;
            --square-filled: #1a1a1a;
            --square-filled-border: #333;
            --footer-text: #777;
            --footer-link: #666;
            --footer-link-hover: #1a1a1a;
            --footer-border: #e0e0e0;
            --grid-title-bg: #f0f0f0;
            --grid-title-text: #666;
            --sidebar-border: #e0e0e0;
            --toggle-track: #ddd;
            --optimistic-text: #666;
            --dot-color: #888;
            --year-int: #1a1a1a;
            --stat-number: #666;
            --quote-text: #666;
            --quote-author: #888;
            --notification-bg: #f0f0f0;
            --notification-text: #444;
            --share-btn-bg: rgba(240, 240, 240, 0.7);
            --share-btn-border: #ddd;
            --share-btn-text: #666;
            --share-btn-hover-bg: #e0e0e0;
            --share-btn-hover-text: #1a1a1a;
            --share-btn-hover-border: #aaa;
            --modal-bg: rgba(250,250,250,0.95);
            --modal-border: #ddd;
            --modal-option-hover: #f0f0f0;
            --back-btn-bg: rgba(240, 240, 240, 0.7);
            --back-btn-border: #ddd;
            --back-btn-text: #666;
            --back-btn-hover-bg: #e0e0e0;
            --back-btn-hover-text: #1a1a1a;
            --back-btn-hover-border: #aaa;
            --memento-logo-text: #888;
        }

        /* ============================================================
           СБРОС И БАЗА
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 1.5rem 1.5rem 0 1.5rem;
            font-family: 'Inter', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            color: var(--text);
            letter-spacing: -0.01em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: var(--bg);
            transition: color 0.5s ease, background 0.5s ease;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1 0 auto;
            width: 100%;
            max-width: 820px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .page-content {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            padding-top: clamp(2rem, 8vh, 5rem);
            padding-bottom: 4rem;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2rem;
        }

        /* ============================================================
           ХЕДЕР
           ============================================================ */
        .header {
            text-align: center;
            width: 100%;
        }

        .logo {
            font-size: 15px;
            letter-spacing: 6px;
            color: var(--memento-logo-text);
            text-transform: uppercase;
            margin-bottom: 14px;
            transition: color 0.5s ease;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: clamp(14px, 2.2vw, 16px);
            font-weight: 350;
            line-height: 1.5;
            max-width: 100%;
            opacity: 0.85;
            transition: color 0.5s ease;
        }

        /* ============================================================
           ФУТЕР
           ============================================================ */
        .footer {
            flex-shrink: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.7rem;
            color: var(--footer-text);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            padding: 1.8rem 1rem 3rem;
            border-top: 1px solid var(--footer-border);
            transition: color 0.5s ease, border-color 0.5s ease;
            margin-top: auto;
        }

        .footer .links {
            display: flex;
            gap: 2.2rem;
            flex-wrap: nowrap;
            justify-content: center;
            white-space: nowrap;
        }

        .footer a {
            color: var(--footer-link);
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
            text-decoration-color: transparent;
            transition: text-decoration-color 0.25s, color 0.25s;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .footer a:hover {
            color: var(--footer-link-hover);
            text-decoration-color: currentColor;
        }

        /* ============================================================
           САЙДБАР
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 48px;
            background: var(--sidebar-border);
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            z-index: 25;
            transition: all 0.3s ease;
            opacity: 0.5;
        }

        .sidebar-toggle:hover {
            opacity: 1;
            width: 10px;
            background: var(--footer-link);
        }

        .sidebar-toggle.active {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar {
            position: fixed;
            left: -120px;
            top: 0;
            bottom: 0;
            width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 0.5rem;
            gap: 2rem;
            border-right: 1px solid var(--sidebar-border);
            z-index: 20;
            background: var(--bg);
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s ease, border-color 0.5s ease;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
            justify-content: center;
        }

        .sidebar-dots {
            display: flex;
            gap: 5px;
            opacity: 0.3;
            margin-top: auto;
            margin-bottom: 0.5rem;
        }

        .sidebar-dots span {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .sidebar-label {
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: -1.2rem;
            transition: color 0.3s ease;
        }

        .toggle-track {
            width: 52px;
            height: 28px;
            background: var(--toggle-track);
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
        }

        .toggle-thumb {
            position: absolute;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            left: 3px;
            top: 3px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            line-height: 1;
        }

        .light-theme .toggle-thumb {
            transform: translateX(24px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .lang-toggle-track {
            width: 52px;
            height: 28px;
            background: var(--toggle-track);
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lang-toggle-thumb {
            position: absolute;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            left: 3px;
            top: 3px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #333;
        }

        .lang-en .lang-toggle-thumb {
            transform: translateX(24px);
        }

        .lang-label-left,
        .lang-label-right {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.05em;
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.3s ease;
            color: #fff;
        }

        .lang-label-left {
            margin-right: auto;
            margin-left: 6px;
        }

        .lang-label-right {
            margin-left: auto;
            margin-right: 6px;
        }

        .lang-en .lang-label-right {
            opacity: 1;
        }

        .lang-en .lang-label-left {
            opacity: 0.3;
        }

        body:not(.lang-en) .lang-label-left {
            opacity: 1;
        }

        body:not(.lang-en) .lang-label-right {
            opacity: 0.3;
        }

        /* ============================================================
           ПАНЕЛЬ ВВОДА ДАТЫ
           ============================================================ */
        .date-input-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            transition: all 0.5s ease;
        }

        .input-heading {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            color: var(--text-secondary);
            font-weight: 400;
            transition: color 0.5s ease;
        }

        .selectors {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: nowrap;
            gap: 0.4rem;
            width: 100%;
            max-width: 500px;
        }

        .select-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            flex: 1 1 auto;
            min-width: 0;
        }

        .select-wrapper label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
            transition: color 0.5s ease;
        }

        .custom-select-container {
            position: relative;
            width: 100%;
        }

        .select-trigger {
            appearance: none;
            -webkit-appearance: none;
            background: var(--select-bg);
            border: 1px solid var(--select-border);
            border-radius: 2.5rem;
            padding: 0.9rem 2.4rem 0.9rem 1.2rem;
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--select-text);
            cursor: pointer;
            text-align: center;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 0.7rem center;
            background-size: 1.1rem;
            font-family: inherit;
            transition: border-color 0.25s, background-color 0.25s, color 0.5s ease;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .select-trigger:hover {
            border-color: #555;
            background-color: var(--option-hover-bg);
        }

        .select-overlay {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--overlay-bg);
            border: 1px solid var(--overlay-border);
            border-radius: 1rem;
            margin-top: 0.3rem;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .select-overlay.open {
            display: block;
        }

        .select-option {
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            color: var(--option-text);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            text-align: center;
            border-bottom: 1px solid rgba(128, 128, 128, 0.1);
        }

        .select-option:last-child {
            border-bottom: none;
        }

        .select-option:hover {
            background: var(--option-hover-bg);
            color: var(--option-hover-text);
        }

        .select-option.selected {
            background: var(--option-selected-bg);
            color: var(--option-hover-text);
        }

        .reality-btn {
            background: transparent;
            border: 1px solid var(--btn-border);
            color: var(--btn-text);
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            padding: 1rem 3.5rem;
            border-radius: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 0.8rem;
            background: rgba(20, 20, 20, 0.3);
            backdrop-filter: blur(8px);
        }

        .reality-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .light-theme .reality-btn:hover {
            background: #1a1a1a;
            color: #fff;
            border-color: #1a1a1a;
        }

        .reality-btn:active {
            transform: scale(0.96);
        }

        /* ============================================================
           ПАНЕЛЬ СТАТИСТИКИ
           ============================================================ */
        .stats-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 2rem;
        }

        .stats-panel.active {
            display: flex;
        }

        /* ---- ГОД ---- */
        .year-decimal-timer {
            background: transparent;
            padding: 2rem 1.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        .big-year-number {
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 350;
            letter-spacing: -0.02em;
            color: var(--year-int);
            line-height: 1;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px rgba(128, 128, 128, 0.15);
            font-family: 'Inter', 'SF Mono', 'JetBrains Mono', monospace;
            display: flex;
            align-items: baseline;
            justify-content: center;
        }

        .year-integer {
            color: var(--year-int);
        }

        .year-dot {
            color: var(--dot-color);
            font-size: 0.7em;
            margin: 0 0.02em;
        }

        .year-decimal-flow {
            color: var(--dot-color);
            font-size: 0.7em;
            letter-spacing: 0.04em;
        }

        .year-subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: var(--text-secondary);
            margin-top: 0.3rem;
            font-weight: 400;
        }

        /* ---- СТАТИСТИКА ---- */
        .secondary-stats {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 3rem;
            width: 100%;
            opacity: 0.8;
            padding: 0.5rem 1rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 350;
            letter-spacing: -0.02em;
            color: var(--stat-number);
            line-height: 1.1;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
            font-family: 'Inter', 'SF Mono', 'JetBrains Mono', monospace;
            min-width: 4ch;
            text-align: center;
        }

        .stat-label {

        .square {

        /* ============================================================
           МОДАЛКА

    <script>
        (function() {
            // ============================================================
            // КОНСТАНТЫ
            // ============================================================
            const TOTAL_SQUARES = 100;
            const UPPER_LIFESPAN = 80;
            const STORAGE_KEY = 'memento-birthdate';
            const DECIMAL_PLACES = 9;

            // ============================================================
            // ПЕРЕВОДЫ
            // ============================================================
            const translations = {
                ru: {
                    yearSubtitle: function(y) {
                        if (y % 10 === 1 && y % 100 !== 11) return 'прожитый год';
                        if (y % 10 >= 2 && y % 10 <= 4 && (y % 100 < 10 || y % 100 >= 20)) return 'прожитых года';
                        return 'прожитых лет';
                    },
                    days: 'дней',
                    weeks: 'недель',
                    months: 'месяцев',
                    gridSummary: function(y) {
                        return 'прожито ' + y + ' из ' + TOTAL_SQUARES + ' лет';
                    },
                    optimistic: function(r) {
                        if (r % 10 === 1 && r % 100 !== 11) return 'в лучшем случае остался ~' + r + ' год';
                        if (r % 10 >= 2 && r % 10 <= 4 && (r % 100 < 10 || r % 100 >= 20)) return 'в лучшем случае осталось ~' + r + ' года';
                        return 'в лучшем случае осталось ~' + r + ' лет';
                    },
                    inputHeading: 'Укажите свою дату рождения',
                    day: 'День',
                    month: 'Месяц',
                    year: 'Год',
                    realityBtn: 'Memento',
                    shareBtn: '↗ Поделиться',
                    backBtn: '← Назад',
                    copyLink: '📋 Копировать ссылку',
                    downloadPng: '💾 Скачать PNG',
                    share: '📤 Поделиться',
                    cancel: 'отмена',
                    toastCopied: '✓ Ссылка скопирована',
                    toastDownloaded: '✓ Скриншот скачан',
                    toastNeedCheck: 'Сначала выполните Memento',
                    futureError: 'Дата рождения не может быть в будущем.'
                },
                en: {
                    yearSubtitle: function(y) {
                        return y === 1 ? 'year lived' : 'years lived';
                    },
                    days: 'days',
                    weeks: 'weeks',
                    months: 'months',
                    gridSummary: function(y) {
                        return 'lived ' + y + ' of ' + TOTAL_SQUARES + ' years';
                    },
                    optimistic: function(r) {
                        return r === 1 ? 'at best ~' + r + ' year left' : 'at best ~' + r + ' years left';
                    },
                    inputHeading: 'Enter your date of birth',
                    day: 'Day',
                    month: 'Month',
                    year: 'Year',
                    realityBtn: 'Memento',
                    shareBtn: '↗ Share',
                    backBtn: '← Back',
                    copyLink: '📋 Copy link',
                    downloadPng: '💾 Download PNG',
                    share: '📤 Share',
                    cancel: 'cancel',
                    toastCopied: '✓ Link copied',
                    toastDownloaded: '✓ Screenshot downloaded',
                    toastNeedCheck: 'Do Memento first',
                    futureError: 'Date of birth cannot be in the future.'
                }
            };

            // ============================================================
            // ЦИТАТЫ
            // ============================================================
            const quotes = {
                ru: [
                    {
                        text: '«Ты живёшь так, будто будешь жить вечно.<br>Ты не думаешь о своей хрупкости.»',
                        author: '— Сенека'
                    },
                    {
                        text: '«А ведь где-то уже растёт дерево,<br>из которого сколотят твой гроб.»',
                        author: '— Неизвестный автор'
                    },
                    {
                        text: '«Человек — это не что иное, как сумма его поступков.»',
                        author: '— Жан-Поль Сартр'
                    },
                    {
                        text: '«Каждый день — это маленькая жизнь.»',
                        author: '— Марк Аврелий'
                    },
                    {
                        text: '«Memento mori — помни о смерти. Memento vivere — помни о жизни.»',
                        author: '— Латинская мудрость'
                    }
                ],
                en: [
                    {
                        text: '«You live as if you will live forever.<br>You do not think about your fragility.<br>You do not notice how much time has passed.»',
                        author: '— Seneca'
                    },
                    {
                        text: '«Somewhere a tree is already growing<br>from which your coffin will be made.»',
                        author: '— Unknown author'
                    },
                    {
                        text: '«Man is nothing else but the sum of his actions.»',
                        author: '— Jean-Paul Sartre'
                    },
                    {
                        text: '«Each day is a little life.»',
                        author: '— Marcus Aurelius'
                    },
                    {
                        text: '«Memento mori — remember you must die. Memento vivere — remember to live.»',
                        author: '— Latin wisdom'
                    }
                ]
            };

            // ============================================================
            // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
            // ============================================================
            let currentLang = 'ru';
            let currentQuoteIndex = 0;
            let quoteIntervalId = null;
            let birthDate = null;
            let animationFrameId = null;
            let currentGridYear = -1;
            let selectedDay = 1;
            let selectedMonth = 1;
            let selectedYear = 1995;
            let currentOpenOverlay = null;
            let toastTimer = null;

            const monthNames = [
                'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
            ];

            // ============================================================
            // DOM-ЭЛЕМЕНТЫ
            // ============================================================
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const themeToggle = document.getElementById('themeToggle');
            const toggleIcon = document.getElementById('toggleIcon');
            const langToggle = document.getElementById('langToggle');

            const dayTrigger = document.getElementById('dayTrigger');
            const monthTrigger = document.getElementById('monthTrigger');
            const yearTrigger = document.getElementById('yearTrigger');
            const dayOverlay = document.getElementById('dayOverlay');
            const monthOverlay = document.getElementById('monthOverlay');
            const yearOverlay = document.getElementById('yearOverlay');

            const realityBtn = document.getElementById('realityButton');
            const dateInputPanel = document.getElementById('dateInputPanel');
            const statsPanel = document.getElementById('statsPanel');

            const yearIntegerEl = document.getElementById('yearInteger');
            const yearDecimalFlowEl = document.getElementById('yearDecimalFlow');
            const daysLivedEl = document.getElementById('daysLived');
            const weeksLivedEl = document.getElementById('weeksLived');
            const monthsLivedEl = document.getElementById('monthsLived');
            const lifeGridEl = document.getElementById('lifeGrid');
            const gridSummaryEl = document.getElementById('gridSummary');
            const optimisticRemainingEl = document.getElementById('optimisticRemaining');
            const quoteTextEl = document.getElementById('quoteText');
            const quoteAuthorEl = document.getElementById('quoteAuthor');

            const backBtnBottom = document.getElementById('backBtnBottom');
            const shareBtnBottom = document.getElementById('shareBtnBottom');
            const shareModal = document.getElementById('shareModal');
            const modalQrContainer = document.getElementById('modalQrContainer');
            const toast = document.getElementById('toast');

            // ============================================================
            // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
            // ============================================================
            function t(key) {
                var val = translations[currentLang][key];
                return typeof val === 'function' ? val : val;
            }

            function getCurrentQuotes() {
                return quotes[currentLang];
            }

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                }, 2000);
            }

            function saveBirthDate(d) {
                if (d) {
                    localStorage.setItem(STORAGE_KEY, d.toISOString());
                } else {
                    localStorage.removeItem(STORAGE_KEY);
                }
            }

            function loadBirthDate() {
                var saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    var parsed = new Date(saved);
                    if (!isNaN(parsed.getTime()) && parsed <= new Date()) {
                        return parsed;
                    }
                }
                return null;
            }

            function getDaysInMonth(m, y) {
                return new Date(y, m, 0).getDate();
            }

            function computeExactDecimalYears(b) {
                return (new Date() - b) / (365.25 * 24 * 60 * 60 * 1000);
            }

            function computeLivedDetails(b) {
                var n = new Date();
                var d = n - b;
                if (d < 0) return { days: 0, weeks: 0, months: 0, years: 0 };

                var td = Math.floor(d / (1000 * 60 * 60 * 24));
                var tw = Math.floor(td / 7);
                var y = n.getFullYear() - b.getFullYear();
                var m = n.getMonth() - b.getMonth();
                var dd = n.getDate() - b.getDate();

                if (dd < 0) {
                    m--;
                    dd += new Date(n.getFullYear(), n.getMonth(), 0).getDate();
                }
                if (m < 0) {
                    y--;
                    m += 12;
                }

                return { days: td, weeks: tw, months: y * 12 + m, years: y };
            }

            // ============================================================
            // ОБНОВЛЕНИЕ ТЕКСТОВ
            // ============================================================
            function updateYearSubtitle(years) {
                document.getElementById('yearSubtitle').textContent = translations[currentLang].yearSubtitle(years);
            }

            function updateGridTexts(years) {
                var c = Math.min(years, TOTAL_SQUARES);
                document.getElementById('gridSummary').textContent = translations[currentLang].gridSummary(c);
                document.getElementById('optimisticRemaining').textContent = translations[currentLang].optimistic(Math.max(0, UPPER_LIFESPAN - c));
            }

            function updateStatLabels() {
                document.querySelectorAll('.stat-label[data-ru][data-en]').forEach(function(el) {
                    el.textContent = el.getAttribute('data-' + currentLang);
                });
            }

            function updateAllTexts() {
                document.querySelectorAll('[data-ru][data-en]').forEach(function(el) {
                    el.textContent = el.getAttribute('data-' + currentLang);
                });
                if (birthDate) {
                    var details = computeLivedDetails(birthDate);
                    updateYearSubtitle(details.years);
                    updateGridTexts(details.years);
                    updateStatLabels();
                }
            }

            // ============================================================
            // СЕЛЕКТЫ ДАТЫ
            // ============================================================
            function openOverlay(o) {
                if (currentOpenOverlay && currentOpenOverlay !== o) {
                    closeOverlay(currentOpenOverlay);
                }
                o.classList.add('open');
                currentOpenOverlay = o;
            }

            function closeOverlay(o) {
                o.classList.remove('open');
                if (currentOpenOverlay === o) {
                    currentOpenOverlay = null;
                }
            }

            function renderDayOptions() {
                dayOverlay.innerHTML = '';
                var dim = getDaysInMonth(selectedMonth, selectedYear);
                if (selectedDay > dim) selectedDay = dim;

                for (var d = 1; d <= dim; d++) {
                    var option = document.createElement('div');
                    option.className = 'select-option' + (d === selectedDay ? ' selected' : '');
                    option.textContent = d;
                    option.addEventListener('click', function(e) {
                        e.stopPropagation();
                        selectedDay = parseInt(this.textContent, 10);
                        dayTrigger.textContent = this.textContent;
                        closeOverlay(dayOverlay);
                    });
                    dayOverlay.appendChild(option);
                }
                dayTrigger.textContent = selectedDay;
            }

            function renderMonthOptions() {
                monthOverlay.innerHTML = '';
                monthNames.forEach(function(name, i) {
                    var monthNum = i + 1;
                    var option = document.createElement('div');
                    option.className = 'select-option' + (monthNum === selectedMonth ? ' selected' : '');
                    option.textContent = name;
                    option.addEventListener('click', function(e) {
                        e.stopPropagation();
                        selectedMonth = monthNum;
                        monthTrigger.textContent = name;
                        closeOverlay(monthOverlay);
                        renderDayOptions();
                    });
                    monthOverlay.appendChild(option);
                });
                monthTrigger.textContent = monthNames[selectedMonth - 1];
            }

            function renderYearOptions() {
                yearOverlay.innerHTML = '';
                var currentYear = new Date().getFullYear();

                for (var y = currentYear - 1; y >= currentYear - 100; y--) {
                    var option = document.createElement('div');
                    option.className = 'select-option' + (y === selectedYear ? ' selected' : '');
                    option.textContent = y;
                    option.addEventListener('click', function(e) {
                        e.stopPropagation();
                        selectedYear = parseInt(this.textContent, 10);
                        yearTrigger.textContent = this.textContent;
                        closeOverlay(yearOverlay);
                        renderDayOptions();
                    });
                    yearOverlay.appendChild(option);
                }
                yearTrigger.textContent = selectedYear;
            }

            function restoreSelectsFromDate(d) {
                selectedDay = d.getDate();
                selectedMonth = d.getMonth() + 1;
                selectedYear = d.getFullYear();
                dayTrigger.textContent = selectedDay;
                monthTrigger.textContent = monthNames[selectedMonth - 1];
                yearTrigger.textContent = selectedYear;
                renderDayOptions();
                renderMonthOptions();
                renderYearOptions();
            }

            // Обработчики селектов
            dayTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                if (dayOverlay.classList.contains('open')) {
                    closeOverlay(dayOverlay);
                } else {
                    renderDayOptions();
                    openOverlay(dayOverlay);
                }
            });

            monthTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                if (monthOverlay.classList.contains('open')) {
                    closeOverlay(monthOverlay);
                } else {
                    renderMonthOptions();
                    openOverlay(monthOverlay);
                }
            });

            yearTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                if (yearOverlay.classList.contains('open')) {
                    closeOverlay(yearOverlay);
                } else {
                    renderYearOptions();
                    openOverlay(yearOverlay);
                }
            });

            document.addEventListener('click', function() {
                [dayOverlay, monthOverlay, yearOverlay].forEach(function(o) {
                    closeOverlay(o);
                });
            });

            // ============================================================
            // САЙДБАР И ТЕМА
            // ============================================================
            sidebarToggle.addEventListener('click', function() {
                sidebar.classList.toggle('open');
                sidebarToggle.classList.toggle('active');
            });

            document.addEventListener('click', function(e) {
                if (!sidebar.contains(e.target) && e.target !== sidebarToggle) {
                    sidebar.classList.remove('open');
                    sidebarToggle.classList.remove('active');
                }
            });

            function applyTheme(theme) {
                var isLight = theme === 'light';
                document.body.classList.toggle('light-theme', isLight);
                toggleIcon.textContent = isLight ? '☀️' : '🌙';
                localStorage.setItem('memento-theme', theme);
            }

            var savedTheme = localStorage.getItem('memento-theme') || 'dark';
            applyTheme(savedTheme);

            themeToggle.addEventListener('click', function() {
                var isLight = document.body.classList.contains('light-theme');
                applyTheme(isLight ? 'dark' : 'light');
            });

            // ============================================================
            // ЯЗЫК
            // ============================================================
            var savedLang = localStorage.getItem('memento-lang') || 'ru';
            currentLang = savedLang;
            if (currentLang === 'en') document.body.classList.add('lang-en');
            updateAllTexts();

            langToggle.addEventListener('click', function() {
                currentLang = currentLang === 'ru' ? 'en' : 'ru';
                if (currentLang === 'en') {
                    document.body.classList.add('lang-en');
                } else {
                    document.body.classList.remove('lang-en');
                }
                localStorage.setItem('memento-lang', currentLang);
                updateAllTexts();
                if (birthDate) {
                    var details = computeLivedDetails(birthDate);
                    updateYearSubtitle(details.years);
                    updateGridTexts(details.years);
                    updateStatLabels();
                }
                showQuoteRaw(getCurrentQuotes()[currentQuoteIndex % getCurrentQuotes().length]);
            });

            // ============================================================
            // СЕТКА И СЧЁТЧИК
            // ============================================================
            function renderGrid(lived) {
                var count = Math.min(lived, TOTAL_SQUARES);
                if (count === currentGridYear) return;
                currentGridYear = count;

                lifeGridEl.innerHTML = '';
                for (var i = 0; i < TOTAL_SQUARES; i++) {
                    var square = document.createElement('div');
                    square.className = 'square' + (i < count ? ' filled' : '');
                    lifeGridEl.appendChild(square);
                }
                gridSummaryEl.textContent = translations[currentLang].gridSummary(count);
                optimisticRemainingEl.textContent = translations[currentLang].optimistic(Math.max(0, UPPER_LIFESPAN - count));
            }

            function updateLiveCounter() {
                if (!birthDate) return;

                var decimalYears = computeExactDecimalYears(birthDate);
                var parts = decimalYears.toFixed(DECIMAL_PLACES).split('.');
                yearIntegerEl.textContent = parts[0];
                yearDecimalFlowEl.textContent = parts[1];

                var details = computeLivedDetails(birthDate);
                daysLivedEl.textContent = details.days.toLocaleString();
                weeksLivedEl.textContent = details.weeks.toLocaleString();
                monthsLivedEl.textContent = details.months.toLocaleString();
                renderGrid(details.years);
                updateYearSubtitle(details.years);
            }

            function startRealtimeUpdates() {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);

                function tick() {
                    updateLiveCounter();
                    animationFrameId = requestAnimationFrame(tick);
                }
                tick();
            }

            function stopRealtimeUpdates() {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
            }

            // ============================================================
            // ЦИТАТЫ
            // ============================================================
            function showQuoteRaw(quote) {
                quoteTextEl.style.opacity = '0';
                quoteAuthorEl.style.opacity = '0';

                setTimeout(function() {
                    quoteTextEl.innerHTML = quote.text;
                    quoteAuthorEl.textContent = quote.author;
                    quoteTextEl.style.opacity = '0.8';
                    quoteAuthorEl.style.opacity = '1';
                }, 400);
            }

            function showQuote(index) {
                var quotesList = getCurrentQuotes();
                showQuoteRaw(quotesList[index % quotesList.length]);
            }

            function startQuoteCarousel() {
                if (quoteIntervalId) clearInterval(quoteIntervalId);
                currentQuoteIndex = 0;
                showQuote(0);
                quoteIntervalId = setInterval(function() {
                    currentQuoteIndex = (currentQuoteIndex + 1) % getCurrentQuotes().length;
                    showQuote(currentQuoteIndex);
                }, 6000);
            }

            function stopQuoteCarousel() {
                if (quoteIntervalId) {
                    clearInterval(quoteIntervalId);
                    quoteIntervalId = null;
                }
            }

            // ============================================================
            // ПАНЕЛИ
            // ============================================================
            function showStatsPanel() {
                dateInputPanel.style.display = 'none';
                statsPanel.classList.add('active');
                currentGridYear = -1;
                if (birthDate) {
                    updateLiveCounter();
                    startRealtimeUpdates();
                }
                startQuoteCarousel();
            }

            function showInputPanel() {
                stopRealtimeUpdates();
                stopQuoteCarousel();
                statsPanel.classList.remove('active');
                dateInputPanel.style.display = 'flex';
            }

            realityBtn.addEventListener('click', function() {
                var newDate = new Date(selectedYear, selectedMonth - 1, selectedDay);
                if (newDate > new Date()) {
                    alert(t('futureError'));
                    return;
                }
                stopRealtimeUpdates();
                birthDate = newDate;
                saveBirthDate(birthDate);
                showStatsPanel();
            });

            backBtnBottom.addEventListener('click', function() {
                stopRealtimeUpdates();
                stopQuoteCarousel();
                statsPanel.classList.remove('active');
                dateInputPanel.style.display = 'flex';
                if (birthDate) {
                    restoreSelectsFromDate(birthDate);
                }
            });

            // ============================================================
            // ПОДЕЛИТЬСЯ — 2K PNG ДЛЯ РАБОЧЕГО СТОЛА
            // ============================================================
            function generateModalQR() {
                modalQrContainer.innerHTML = '';
                new QRCode(modalQrContainer, {
                    text: window.location.href,
                    width: 120,
                    height: 120,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
            }

            async function generateDesktopScreenshotBlob() {
                var details = computeLivedDetails(birthDate);
                var decimalYears = computeExactDecimalYears(birthDate);
                var quote = getCurrentQuotes()[currentQuoteIndex % getCurrentQuotes().length];
                var isLight = document.body.classList.contains('light-theme');

                // Цвета для скриншота
                var bg = isLight ? '#f5f5f5' : '#0a0a0a';
                var muted = isLight ? '#666' : '#7a7a7a';
                var sEmpty = isLight ? '#e0e0e0' : '#181818';
                var sFilled = isLight ? '#1a1a1a' : '#d4d4d4';
                var sBorder = isLight ? '#d0d0d0' : '#2a2a2a';
                var sFilledBorder = isLight ? '#333' : '#6a6a6a';
                var statColor = isLight ? '#666' : '#aaaaaa';
                var dotColor = isLight ? '#888' : '#b0b0b0';
                var yearColor = isLight ? '#1a1a1a' : '#f5f5f5';
                var quoteColor = isLight ? '#666' : '#6a6a6a';
                var quoteAuthorColor = isLight ? '#888' : '#555';
                var logoColor = isLight ? '#888' : '#a0a0a0';

                // Создаём временный элемент
                var wrapper = document.createElement('div');
                wrapper.style.cssText = 'position:fixed;left:-9999px;top:0;';

                // Собираем HTML для скриншота 2560x1440
                var html = '';

                // Открывающий контейнер
                html += '<div style="width:2560px;height:1440px;background:' + bg + ';display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Inter,sans-serif;color:#e0e0e0;padding:250px 500px;">';

                // Логотип
                html += '<div style="font-size:22px;letter-spacing:8px;color:' + logoColor + ';text-transform:uppercase;margin-bottom:60px;">Memento</div>';

                // Год
                html += '<div style="font-size:140px;font-weight:350;font-family:monospace;color:' + yearColor + ';line-height:1;text-shadow:0 0 40px rgba(128,128,128,0.12);">';
                html += Math.floor(decimalYears);
                html += '<span style="color:' + dotColor + ';font-size:0.7em;">.' + decimalYears.toFixed(DECIMAL_PLACES).split('.')[1] + '</span>';
                html += '</div>';

                // Подпись года
                html += '<div style="font-size:22px;text-transform:uppercase;letter-spacing:6px;color:' + muted + ';margin-top:16px;margin-bottom:60px;">';
                html += translations[currentLang].yearSubtitle(details.years);
                html += '</div>';

                // Статистика
                html += '<div style="display:flex;gap:120px;margin-bottom:60px;color:' + statColor + ';font-size:36px;">';

                html += '<div style="text-align:center;">';
                html += '<span style="font-family:monospace;">' + details.days.toLocaleString() + '</span>';
                html += '<div style="font-size:16px;text-transform:uppercase;letter-spacing:4px;margin-top:10px;color:' + muted + ';">' + t('days') + '</div>';
                html += '</div>';

                html += '<div style="text-align:center;">';
                html += '<span style="font-family:monospace;">' + details.weeks.toLocaleString() + '</span>';
                html += '<div style="font-size:16px;text-transform:uppercase;letter-spacing:4px;margin-top:10px;color:' + muted + ';">' + t('weeks') + '</div>';
                html += '</div>';

                html += '<div style="text-align:center;">';
                html += '<span style="font-family:monospace;">' + details.months.toLocaleString() + '</span>';
                html += '<div style="font-size:16px;text-transform:uppercase;letter-spacing:4px;margin-top:10px;color:' + muted + ';">' + t('months') + '</div>';
                html += '</div>';

                html += '</div>';

                // Заголовок сетки
                html += '<div style="font-size:20px;text-transform:uppercase;letter-spacing:5px;color:' + muted + ';margin-bottom:16px;">';
                html += translations[currentLang].gridSummary(details.years);
                html += '</div>';

                // Сетка квадратов
                html += '<div style="display:grid;grid-template-columns:repeat(25,28px);gap:6px;margin-bottom:16px;">';
                for (var i = 0; i < TOTAL_SQUARES; i++) {
                    var filled = i < details.years;
                    html += '<div style="width:28px;height:28px;background:' + (filled ? sFilled : sEmpty) + ';';
                    html += 'border:1px solid ' + (filled ? sFilledBorder : sBorder) + ';';
                    if (filled) {
                        html += 'box-shadow:0 0 8px rgba(128,128,128,0.12);';
                    }
                    html += '"></div>';
                }
                html += '</div>';

                // Оптимистичный остаток
                html += '<div style="font-size:18px;color:' + muted + ';opacity:0.8;margin-bottom:60px;">';
                html += translations[currentLang].optimistic(Math.max(0, 80 - details.years));
                html += '</div>';

                // Цитата
                html += '<div style="font-size:22px;font-style:italic;color:' + quoteColor + ';text-align:center;max-width:1000px;line-height:1.5;margin-bottom:12px;opacity:0.8;">';
                html += quote.text.replace(/<br>/g, ' ');
                html += '</div>';

                html += '<div style="font-size:18px;color:' + quoteAuthorColor + ';opacity:0.8;">' + quote.author + '</div>';

                // Закрывающий контейнер
                html += '</div>';

                // Вставляем в DOM
                wrapper.innerHTML = html;
                document.body.appendChild(wrapper);

                try {
                    // Делаем скриншот
                    var canvas = await html2canvas(wrapper.querySelector('div'), {
                        backgroundColor: bg,
                        scale: 1,
                        width: 2560,
                        height: 1440
                    });

                    // Конвертируем в Blob
                    return await new Promise(function(resolve) {
                        canvas.toBlob(resolve, 'image/png');
                    });
                } finally {
                    // Удаляем временный элемент
                    document.body.removeChild(wrapper);
                }
            }

            async function downloadScreenshot() {
                var blob = await generateDesktopScreenshotBlob();
                if (!blob) {
                    showToast('Ошибка при создании скриншота');
                    return;
                }

                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'memento.png';
                a.click();
                URL.revokeObjectURL(url);

                showToast(t('toastDownloaded'));
            }

            async function shareScreenshot() {
                var blob = await generateDesktopScreenshotBlob();
                if (!blob) {
                    showToast('Ошибка при создании скриншота');
                    return;
                }

                var file = new File([blob], 'memento.png', { type: 'image/png' });

                // Пробуем нативный шаринг
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Memento',
                            text: 'Посмотри на свою жизнь в квадратах',
                            files: [file]
                        });
                    } catch (err) {
                        // Если пользователь отменил — ничего не делаем
                        if (err.name !== 'AbortError') {
                            // Иначе скачиваем
                            downloadScreenshot();
                        }
                    }
                } else {
                    // Если шаринг не поддерживается — скачиваем
                    downloadScreenshot();
                }
            }

            // Обработчик кнопки «Поделиться»
            shareBtnBottom.addEventListener('click', function() {
                if (!birthDate) {
                    showToast(t('toastNeedCheck'));
                    return;
                }

                generateModalQR();
                shareModal.classList.add('open');
            });

            // Обработчик модалки
            shareModal.addEventListener('click', async function(e) {
                var action = e.target.dataset.action;
                if (!action) return;

                // Закрываем модалку
                shareModal.classList.remove('open');

                if (action === 'close') return;

                if (action === 'copy') {
                    // Копируем ссылку
                    try {
                        await navigator.clipboard.writeText(window.location.href);
                        showToast(t('toastCopied'));
                    } catch (err) {
                        showToast(window.location.href);
                    }
                }

                if (action === 'download') {
                    // Скачиваем PNG
                    await downloadScreenshot();
                }

                if (action === 'share') {
                    // Шарим
                    await shareScreenshot();
                }
            });

            // ============================================================
            // ЗАВЕРШЕНИЕ РАБОТЫ
            // ============================================================
            window.addEventListener('beforeunload', function() {
                stopRealtimeUpdates();
                stopQuoteCarousel();
            });

            // ============================================================
            // ИНИЦИАЛИЗАЦИЯ
            // ============================================================
            renderDayOptions();
            renderMonthOptions();
            renderYearOptions();

            var savedDate = loadBirthDate();
            if (savedDate) {
                birthDate = savedDate;
                restoreSelectsFromDate(birthDate);
                showStatsPanel();
            } else {
                showInputPanel();
            }
        })();
    </script>
</body>
</html>
